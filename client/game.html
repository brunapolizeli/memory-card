<!doctype html>
<html lang="en">
  <head>
    <title>Memory Card: Game Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="game-content">
      <div id="header-placeholder"></div>

      <main>
        <section class="game-details-page">
          <a class="back-to-library-link" href="library.html"
            ><img
              class="leftward-arrow-icon"
              src="assets/icons/leftward-arrow-icon.png"
          /></a>
          <section class="game-page-intro">
            <h2 class="game-page-title"></h2>
            <img class="game-page-cover" />
          </section>
          <section class="game-page-stats">
            <section class="game-progress">
              <div class="game-progress-title">
                <img
                  class="game-page-icon progress-icon"
                  src="assets/icons/progress-icon.png"
                />
                <h3>My Progress</h3>
              </div>
              <div class="progress-dropdown">
                <button type="button" class="progress-toggle-btn"></button>
                <ul class="progress-options" hidden>
                  <li>
                    <label
                      >Haven't Started
                      <input type="radio" name="progress" value="not-started"
                    /></label>
                  </li>
                  <li>
                    <label
                      >Started
                      <input type="radio" name="progress" value="started"
                    /></label>
                  </li>
                  <li>
                    <label
                      >Completed
                      <input type="radio" name="progress" value="completed"
                    /></label>
                  </li>
                  <li>
                    <label
                      >Platinum
                      <input type="radio" name="progress" value="platinum"
                    /></label>
                  </li>
                </ul>
              </div>
            </section>
            <section class="game-status">
              <div class="game-status-title">
                <img
                  class="game-page-icon status-icon"
                  src="assets/icons/status-icon.png"
                />
                <h3>Status</h3>
              </div>
              <div class="status-dropdown">
                <button type="button" class="status-toggle-btn"></button>
                <ul class="status-options" hidden>
                  <li>
                    <label
                      >Wishlist
                      <input type="radio" name="status" value="wishlist"
                    /></label>
                  </li>
                  <li>
                    <label
                      >Backlog
                      <input type="radio" name="status" value="backlog"
                    /></label>
                  </li>
                  <li>
                    <label
                      >Playing
                      <input type="radio" name="status" value="playing"
                    /></label>
                  </li>
                  <li>
                    <label
                      >On Hold
                      <input type="radio" name="status" value="on-hold"
                    /></label>
                  </li>
                  <li>
                    <label
                      >Finished
                      <input type="radio" name="status" value="finished"
                    /></label>
                  </li>
                  <li>
                    <label
                      >Replaying
                      <input type="radio" name="status" value="replaying"
                    /></label>
                  </li>
                  <li>
                    <label
                      >Dropped
                      <input type="radio" name="status" value="dropped"
                    /></label>
                  </li>
                </ul>
              </div>
            </section>
            <section class="game-details">
              <div class="game-details-title">
                <img
                  class="gamepad-icon game-page-icon"
                  src="assets/icons/gamepad-icon.png"
                />
                <h3>Details</h3>
              </div>
              <div class="game-details-grid">
                <div class="platform-selection">
                  <h4 class="platform-selection-title">
                    <img
                      class="game-page-icon pc-icon"
                      src="assets/icons/pc-icon.png"
                    />Platform
                  </h4>
                  <button class="platform-selection-btn" type="button"></button>
                </div>
                <div class="hours-played-wrapper">
                  <h4 class="hours-played-field-title">
                    <img
                      class="game-page-icon clock-icon"
                      src="assets/icons/clock-icon.png"
                    />
                    Hours Played
                  </h4>
                  <input class="hours-played-field" type="text" />
                </div>
                <div class="minutes-played-wrapper">
                  <h4 class="minutes-played-field-title">
                    <img
                      class="game-page-icon clock-icon"
                      src="assets/icons/stopwatch-icon.png"
                    />
                    Minutes Played
                  </h4>
                  <input class="minutes-played-field" type="text" />
                </div>
                <div class="user-rating-wrapper">
                  <h4 class="user-rating-title">
                    <img
                      class="user-rating-section-icon"
                      src="assets/icons/user-rating-section-icon.png"
                    />User Rating
                  </h4>
                  <ul class="user-rating-stars">
                    <li>
                      <button type="button" class="star-btn" data-value="1">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                      </button>
                    </li>
                    <li>
                      <button type="button" class="star-btn" data-value="2">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                      </button>
                    </li>
                    <li>
                      <button type="button" class="star-btn" data-value="3">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                      </button>
                    </li>
                    <li>
                      <button type="button" class="star-btn" data-value="4">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                      </button>
                    </li>
                    <li>
                      <button type="button" class="star-btn" data-value="5">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                      </button>
                    </li>
                    <li>
                      <button type="button" class="star-btn" data-value="6">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                      </button>
                    </li>
                  </ul>
                  <div class="user-rating-tooltip">
                    <p class="user-rating-fraction"></p>
                    <p class="user-rating-label"></p>
                  </div>
                </div>
                <div class="rawg-rating-wrapper">
                  <h4 class="rawg-rating-title">
                    <img
                      class="rawg-rating-section-icon"
                      src="assets/icons/rawg-rating-section-icon.png"
                    />RAWG Rating
                  </h4>
                  <ul class="rawg-rating-stars">
                    <li>
                      <div class="rawg-star">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                        <div class="star-fill">
                          <img
                            class="filled-star-icon"
                            src="assets/icons/green-rating-icon.png"
                          />
                        </div>
                      </div>
                    </li>
                    <li>
                      <div class="rawg-star">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                        <div class="star-fill">
                          <img
                            class="filled-star-icon"
                            src="assets/icons/green-rating-icon.png"
                          />
                        </div>
                      </div>
                    </li>
                    <li>
                      <div class="rawg-star">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                        <div class="star-fill">
                          <img
                            class="filled-star-icon"
                            src="assets/icons/green-rating-icon.png"
                          />
                        </div>
                      </div>
                    </li>
                    <li>
                      <div class="rawg-star">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                        <div class="star-fill">
                          <img
                            class="filled-star-icon"
                            src="assets/icons/green-rating-icon.png"
                          />
                        </div>
                      </div>
                    </li>
                    <li>
                      <div class="rawg-star">
                        <img
                          class="empty-rating-icon"
                          src="assets/icons/empty-rating-icon.png"
                        />
                        <div class="star-fill">
                          <img
                            class="filled-star-icon"
                            src="assets/icons/green-rating-icon.png"
                          />
                        </div>
                      </div>
                    </li>
                  </ul>
                  <div class="rawg-rating-tooltip">
                    <p class="rawg-rating-fraction"></p>
                  </div>
                </div>
                <div class="difficulty-wrapper">
                  <h4 class="difficulty-title">
                    <img
                      class="difficulty-section-icon"
                      src="assets/icons/difficulty-section-icon.png"
                    />Difficulty
                  </h4>
                  <div class="difficulty-row">
                    <ul class="difficulty-drops">
                      <li>
                        <button type="button" class="drop-btn" data-value="1">
                          <img
                            class="empty-difficulty-icon"
                            src="assets/icons/empty-difficulty-icon.png"
                          />
                        </button>
                      </li>
                      <li>
                        <button type="button" class="drop-btn" data-value="2">
                          <img
                            class="empty-difficulty-icon"
                            src="assets/icons/empty-difficulty-icon.png"
                          />
                        </button>
                      </li>
                      <li>
                        <button type="button" class="drop-btn" data-value="3">
                          <img
                            class="empty-difficulty-icon"
                            src="assets/icons/empty-difficulty-icon.png"
                          />
                        </button>
                      </li>
                      <li>
                        <button type="button" class="drop-btn" data-value="4">
                          <img
                            class="empty-difficulty-icon"
                            src="assets/icons/empty-difficulty-icon.png"
                          />
                        </button>
                      </li>
                      <li>
                        <button type="button" class="drop-btn" data-value="5">
                          <img
                            class="empty-difficulty-icon"
                            src="assets/icons/empty-difficulty-icon.png"
                          />
                        </button>
                      </li>
                    </ul>
                    <div class="difficulty-tooltip">
                      <p class="difficulty-label"></p>
                    </div>
                  </div>
                </div>
              </div>
            </section>
            <section class="timeline-section">
              <div class="timeline-title">
                <img
                  class="calendar-icon"
                  src="assets/icons/calendar-icon.png"
                />
                <h3>Timeline</h3>
              </div>
              <div class="start-date-wrapper">
                <label for="start-date">Start Date</label>
                <input class="start-date-field" name="start-date" type="date" />
              </div>
              <div class="completed-date-wrapper">
                <label for="completed-date">Completion Date</label>
                <input
                  class="completed-date-field"
                  name="completed-date"
                  type="date"
                />
              </div>
              <div class="platinum-date-wrapper">
                <label for="platinum-date">Platinum Date</label>
                <input
                  class="platinum-date-field"
                  name="platinum-date"
                  type="date"
                />
              </div>
            </section>
            <section class="notes-section">
              <div class="notes-title">
                <img class="note-icon" src="assets/icons/note-icon.png" />
                <h3>Notes</h3>
              </div>
              <div class="completed-notes-wrapper">
                <label for="completed-notes">Completion Notes</label>
                <textarea
                  class="completed-notes-field"
                  name="completed-notes"
                  placeholder="Story length, key choices, anything worth remembering before finishing..."
                ></textarea>
              </div>
              <div class="platinum-notes-wrapper">
                <label for="platinum-notes">Platinum Notes</label>
                <textarea
                  class="platinum-notes-field"
                  name="platinum-notes"
                  placeholder="Missable trophies, grind time, tips for the platinum..."
                ></textarea>
              </div>
            </section>
          </section>
        </section>
      </main>
      <div class="platform-search-overlay" hidden>
        <div class="platform-search-modal">
          <div class="platform-search-header">
            <h3>Select Platform</h3>
            <button type="button" class="close-platform-search-btn">x</button>
          </div>
          <input
            type="text"
            class="platform-search-input"
            placeholder="Search platform..."
          />
          <ul class="platform-search-results"></ul>
        </div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script type="module">
      import {
        renderHeader,
        renderFooter,
        updateHeaderAuthState,
        initHeaderListeners,
      } from "./js/shared/layout.js";

      document.querySelector("#header-placeholder").innerHTML = renderHeader();
      document.querySelector("#footer-placeholder").innerHTML = renderFooter();
      updateHeaderAuthState();
      initHeaderListeners();
    </script>
    <script type="module" src="js/render/game.js"></script>
  </body>
</html>
