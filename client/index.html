<!doctype html>
<html lang="en">
  <head>
    <title>Memory Card: Game Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="home-content">
      <div id="header-placeholder"></div>
      <main>
        <section class="stats">
          <h2>Your Library</h2>
          <ul class="stats-grid">
            <li class="stat-card">
              <p class="stat-label">Games Tracked</p>
              <p class="stat-value"></p>
            </li>
            <li class="stat-card">
              <p class="stat-label">Completed</p>
              <p class="stat-value"></p>
            </li>
            <li class="stat-card">
              <p class="stat-label">Platinum</p>
              <p class="stat-value"></p>
            </li>
            <li class="stat-card">
              <p class="stat-label">Hours Logged</p>
              <p class="stat-value"></p>
            </li>
          </ul>
        </section>

        <section class="my-library">
          <div class="my-library-header">
            <h2>Recently Added</h2>
            <a href="library.html">See all</a>
          </div>
          <ul class="recently-added-list"></ul>
        </section>

        <section class="add-game">
          <h2>Add a game</h2>
          <p>Search the RAWG catalog and start tracking something new.</p>
          <div class="add-game-search">
            <input
              type="text"
              class="add-game-search-input"
              placeholder="Search a game..."
              aria-label="Search for a game"
            />
            <button type="button" class="add-game-search-btn">→</button>
          </div>
        </section>
      </main>
      <div id="footer-placeholder"></div>
    </div>
    <div class="modal-overlay">
      <button type="button" class="close-auth-btn">x</button>
      <h1>Welcome Back!</h1>
      <section class="auth-modal">
        <form class="login-form">
          <label for="login-email">Email</label>
          <input type="text" name="login-email" />
          <label for="login-password">Password</label>
          <input type="password" name="login-password" />
          <p class="error-message login-error" hidden></p>
          <button class="modal-login-btn">Login</button>
          <p>
            Don't have an account?
            <button type="button" class="toggle-btn" data-target="signup">
              Go to signup
            </button>
          </p>
        </form>
        <form class="signup-form" hidden>
          <label for="signup-username">Username</label>
          <input type="text" name="signup-username" />
          <p class="error-message username-error" hidden></p>
          <label for="signup-email">Email</label>
          <input type="text" name="signup-email" />
          <p class="error-message email-error" hidden></p>
          <label for="signup-password">Password</label>
          <input type="password" name="signup-password" />
          <p class="error-message signup-error" hidden></p>
          <button class="modal-signup-btn">Sign Up</button>
          <p>
            Already have an account?
            <button type="button" class="toggle-btn" data-target="login">
              Go to login
            </button>
          </p>
        </form>
      </section>
    </div>
    <script type="module">
      import {
        renderHeader,
        renderFooter,
        updateHeaderAuthState,
        initHeaderListeners,
      } from "./js/shared/layout.js";

      document.querySelector("#header-placeholder").innerHTML = renderHeader();
      document.querySelector("#footer-placeholder").innerHTML = renderFooter();
      updateHeaderAuthState();
      initHeaderListeners();
    </script>
    <script type="module" src="js/render/home.js"></script>
  </body>
</html>
