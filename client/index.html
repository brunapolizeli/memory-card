<!doctype html>
<html lang="en">
  <head>
    <title>Memory Card: Game Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="home-content">
      <div id="header-placeholder"></div>
      <main>
        <section class="hero">
          <h2>Currently Playing</h2>
          <ul class="currently-playing"></ul>
          <div class="hero-dots-container"></div>
        </section>
        <section class="stats"></section>
        <section class="my-library"></section>
        <section class="add-game"></section>
      </main>
      <div id="footer-placeholder"></div>
    </div>
    <div class="modal-overlay">
      <button type="button" class="close-auth-btn">x</button>
      <h1>Welcome Back!</h1>
      <section class="auth-modal">
        <form class="login-form">
          <label for="login-email">Email</label>
          <input type="text" name="login-email" />
          <label for="login-password">Password</label>
          <input type="password" name="login-password" />
          <p class="error-message login-error" hidden></p>
          <button class="login-btn">Login</button>
          <p>
            Don't have an account?
            <button type="button" class="toggle-btn" data-target="signup">
              Go to signup
            </button>
          </p>
        </form>
        <form class="signup-form" hidden>
          <label for="signup-username">Username</label>
          <input type="text" name="signup-username" />
          <p class="error-message username-error" hidden></p>
          <label for="signup-email">Email</label>
          <input type="text" name="signup-email" />
          <p class="error-message email-error" hidden></p>
          <label for="signup-password">Password</label>
          <input type="password" name="signup-password" />
          <p class="error-message signup-error" hidden></p>
          <button class="signup-btn">Sign Up</button>
          <p>
            Already have an account?
            <button type="button" class="toggle-btn" data-target="login">
              Go to login
            </button>
          </p>
        </form>
      </section>
    </div>
    <script type="module">
      import { renderHeader, renderFooter } from "./js/shared/layout.js";

      document.querySelector("#header-placeholder").innerHTML = renderHeader();
      document.querySelector("#footer-placeholder").innerHTML = renderFooter();
    </script>
    <script type="module" src="js/render/home.js"></script>
  </body>
</html>
