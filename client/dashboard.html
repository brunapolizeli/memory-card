<!doctype html>
<html lang="en">
  <head>
    <title>Memory Card: Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="dashboard-content">
      <div id="header-placeholder"></div>

      <main>
        <section class="dashboard-page">
          <div class="dashboard-title-wrapper">
            <h2>Dashboard</h2>
          </div>
          <section class="user-stats">
            <div class="user-stats-title-wrapper">
              <h3>My Stats</h3>
            </div>
            <ul class="user-stats-grid">
              <li class="games-tracked-stats">
                <h4>Games Tracked</h4>
                <p data-name="games_tracked"></p>
              </li>
              <li class="total-playtime-stats">
                <h4>Total Playtime</h4>
                <p data-name="total_playtime"></p>
              </li>
              <li class="average-rating-stats">
                <h4>Average Rating</h4>
                <p data-name="average_rating"></p>
              </li>
              <li class="games-finished-stats">
                <h4>Games Finished</h4>
                <p data-name="games_finished"></p>
              </li>
              <li class="backlog-stats">
                <h4>Backlog</h4>
                <p data-name="backlog_total"></p>
              </li>
              <li class="top-platform-stats">
                <h4>Top Platform</h4>
                <p data-name="top_platform"></p>
              </li>
              <li class="games-platinumed-stats">
                <h4>Games Platinumed</h4>
                <p data-name="games_platinumed"></p>
              </li>
              <li class="wishlist-stats">
                <h4>Wishlist</h4>
                <p data-name="wishlist_total"></p>
              </li>
              <li class="favorite-genre-stats">
                <h4>Favorite Genre</h4>
                <p data-name="favorite_genre"></p>
              </li>
            </ul>
          </section>
        </section>
      </main>

      <div id="footer-placeholder"></div>
      <div id="loading-overlay-placeholder"></div>
    </div>

    <script type="module">
      import {
        renderHeader,
        renderFooter,
        updateHeaderAuthState,
        initHeaderListeners,
      } from "./js/shared/layout.js";
      import { renderLoadingOverlay } from "./js/shared/loading.js";

      document.querySelector("#header-placeholder").innerHTML = renderHeader();
      document.querySelector("#footer-placeholder").innerHTML = renderFooter();
      document.querySelector("#loading-overlay-placeholder").innerHTML =
        renderLoadingOverlay();
      updateHeaderAuthState();
      initHeaderListeners();
    </script>
    <script type="module" src="js/render/dashboard.js"></script>
  </body>
</html>
